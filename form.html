    <h1>Edit News Item</h1> 
    <form 
      action="https://students.open.ac.uk/mct/tm252/reflect/reflect.php" 
      method="POST" 
      novalidate 
      aria-describedby="formInstructions" 
    > 
      <p id="formInstructions" class="form-text mb-3"> 
        Please update the news item details below and submit the form. 
      </p> 
 
      <!-- Hidden field for itemID --> 
      
 
      <!-- News Title --> 
      <div class="mb-3"> 
        News Title
        
      </div> 
 
      <!-- News Date --> 
      <div class="mb-3"> 
       Date
       
      </div> 
 
      <!-- News Description --> 
      <div class="mb-3"> 
        <label for="newsDescription" class="form-label">Description</label> 
        <textarea 
          class="form-control" 
          id="newsDescription" 
          name="description" 
          rows="5" 
          required 
          aria-required="true" 
        >We are excited to announce the launch of a new feature that improves learning event management on EduMax.</textarea> 
      </div> 
 
      <!-- Submit button --> 
      <button type="submit" class="btn btn-primary">Submit</button> 
    </form>
