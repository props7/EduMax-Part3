<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduMax – Add Announcement</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="custom.css">
</head>

<body>
    

        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container">
                <a class="navbar-brand" href="#">EduMax Admin</a>
        
                <button
            
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">
            
                <span class="navbar-toggler-icon"></span>
            
            </button>
        
                
                <div class="collapse navbar-collapse" id="navbarNav">
        
                    <ul class="navbar-nav ms-auto">
        
                        <li class="nav-item">
                            <a class="nav-link" href="#">Dashboard</a>
                        </li>
        
                        <li class="nav-item">
                            <a class="nav-link active" href="#">Announcements</a>
                        </li>
        
                        <li class="nav-item">
                            <a class="nav-link" href="#">Learning Events</a>
                        </li>
        
                    </ul>
                </div>
            </div>
        </nav>
        <div class="container mt-4">

            <h1>Add Announcement</h1>
        
            <form action="https://students.open.ac.uk/mct/tm252/reflect/reflect.php"
                  method="POST">
                 
                  <input type="hidden"
                  name="item_ID"
                  value="30001000-5000-654321fedcba">

                  <div class="mb-3">
                    <label for="title" class="form-label">
                        Announcement Title
                    </label>
            
                    <input
                        type="text"
                        class="form-control"
                        id="title"
                        name="title"
                        value="Exam Timetable Released">
                </div>
                <div class="mb-3">
                    <label for="message" class="form-label">
                        Announcement
                    </label>
                
                    <textarea
                        class="form-control"
                        id="message"
                        name="message"
                        rows="5">The final examination timetable is now available. Please check your student portal for details.</textarea>
                </div>
                <div class="mb-3">
                    <label for="publishDate" class="form-label">
                        Publish Date
                    </label>
                
                    <input
                        type="date"
                        class="form-control"
                        id="publishDate"
                        name="publishDate"
                        value="2026-08-25">
                </div>
                <div class="mb-3">
                    <label for="expiryDate" class="form-label">
                        Expiry Date
                    </label>
                
                    <input
                        type="date"
                        class="form-control"
                        id="expiryDate"
                        name="expiryDate"
                        value="2026-09-30">
                </div><div class="mb-3">
                    <label for="priority" class="form-label">
                        Priority
                    </label>
                
                    <select
                        class="form-select"
                        id="priority"
                        name="priority">
                
                        <option>Low</option>
                        <option selected>Medium</option>
                        <option>High</option>
                
                    </select>
                </div><div class="form-check mb-3">
                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="visible"
                        name="visible"
                        checked>
                
                    <label class="form-check-label" for="visible">
                        Visible to students
                    </label>
                </div><button type="submit" class="btn btn-primary">
                    Add Announcement
                </button>
            </form>
        
        </div>   
          
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>   
        

</body>
</html>
